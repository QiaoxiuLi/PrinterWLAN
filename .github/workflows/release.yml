name: Release PrinterWLAN
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-release-candidate:
    name: Build and verify release candidate
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Require Windows x64 client and physical-printer acceptance
        shell: pwsh
        env:
          VALIDATED_COMMIT: ${{ vars.PRINTERWLAN_WINDOWS_CLIENT_VALIDATED_COMMIT }}
        run: |
          $expected = '${{ github.sha }}'
          if ($env:VALIDATED_COMMIT -ne $expected) {
            throw "Release is blocked. Complete Windows 10/11 x64 and physical-printer acceptance, then set PRINTERWLAN_WINDOWS_CLIENT_VALIDATED_COMMIT to $expected."
          }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.401 }
      - name: Prepare, test, and publish
        shell: pwsh
        run: |
          ./scripts/Prepare-ThirdParty.ps1
          dotnet restore PrinterWLAN.slnx --locked-mode
          dotnet build PrinterWLAN.slnx -c Release --no-restore
          dotnet test PrinterWLAN.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"
          dotnet publish src/PrinterWLAN/PrinterWLAN.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PrinterWLAN.iss
          $password=[Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          "PRINTERWLAN_ADMIN_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PRINTERWLAN_ADMIN_PASSWORD=$password
          ./scripts/UpgradeTest.ps1 -CurrentInstallerPath ./artifacts/installer/PrinterWLAN-Setup-x64.exe
          ./scripts/SmokeTest.ps1 -InstallerPath ./artifacts/installer/PrinterWLAN-Setup-x64.exe
      - name: Playwright UI tests
        shell: pwsh
        working-directory: tests/PrinterWLAN.UiTests
        run: |
          npm ci
          npx playwright install chromium
          npm test
      - name: Verify uninstall and checksum
        shell: pwsh
        run: |
          Start-Process "$env:ProgramFiles\PrinterWLAN\unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait
          if (Get-Service PrinterWLAN -ErrorAction SilentlyContinue) { throw 'Service still exists after uninstall.' }
          $file='artifacts/installer/PrinterWLAN-Setup-x64.exe'
          $hash=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PrinterWLAN-Setup-x64.exe" | Set-Content "$file.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v5
        with:
          name: PrinterWLAN-v1.2.0-release-candidate
          path: |
            artifacts/installer/PrinterWLAN-Setup-x64.exe
            artifacts/installer/PrinterWLAN-Setup-x64.exe.sha256
          if-no-files-found: error

  windows-11-desktop-compatibility:
    name: Windows 11 Desktop compatibility
    needs: build-release-candidate
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: PrinterWLAN-v1.2.0-release-candidate
          path: downloaded-artifact
      - name: Full desktop installation, spooler, and native-driver test
        shell: pwsh
        run: |
          $password=[Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          $installer=(Get-ChildItem downloaded-artifact -Filter PrinterWLAN-Setup-x64.exe -Recurse | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Downloaded installer was not found.' }
          ./scripts/WindowsClientAcceptance.ps1 -InstallerPath $installer -AdminPassword $password -OutputDirectory artifacts/windows-11-smoke
      - name: Uninstall desktop test instance
        if: always()
        shell: pwsh
        run: |
          $uninstaller="$env:ProgramFiles\PrinterWLAN\unins000.exe"
          if (Test-Path $uninstaller) {
            Start-Process $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait
          }
          if (Get-Service PrinterWLAN -ErrorAction SilentlyContinue) { throw 'Service still exists after Windows 11 uninstall.' }

  publish-release:
    name: Publish GitHub Release
    needs: [build-release-candidate, windows-11-desktop-compatibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: PrinterWLAN-v1.2.0-release-candidate
          path: artifacts/installer
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' \
            'artifacts/installer/PrinterWLAN-Setup-x64.exe' \
            'artifacts/installer/PrinterWLAN-Setup-x64.exe.sha256' \
            --verify-tag --title 'PrinterWLAN ${{ github.ref_name }}' --notes-file docs/RELEASE_NOTES_v1.2.0.md
