name: Release PrinterWLAN v1.2.0 for Windows Server 2025
on:
  push:
    tags: ['v1.2.0']
permissions:
  contents: write
jobs:
  server-2025-release-candidate:
    name: Full Windows Server 2025 release verification
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Prepare pinned offline dependencies
        shell: pwsh
        run: ./scripts/Prepare-ThirdParty.ps1
      - name: Locked restore, build, test, publish, and installer
        shell: pwsh
        run: |
          dotnet restore PrinterWLAN.slnx --locked-mode
          dotnet build PrinterWLAN.slnx -c Release --no-restore
          dotnet test PrinterWLAN.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"
          dotnet publish src/PrinterWLAN/PrinterWLAN.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PrinterWLAN.iss
      - name: Generate ephemeral release-test credential
        shell: pwsh
        run: |
          $password=[Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          "PRINTERWLAN_ADMIN_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify v1.1.0 to v1.2.0 in-place upgrade
        shell: pwsh
        run: ./scripts/UpgradeTest.ps1 -CurrentInstallerPath ./artifacts/installer/PrinterWLAN-Setup-x64.exe
      - name: Verify Windows Server print-driver path
        shell: pwsh
        run: ./scripts/SmokeTest.ps1 -InstallerPath ./artifacts/installer/PrinterWLAN-Setup-x64.exe -PrinterMode SystemPdf -OutputDirectory ./artifacts/system-smoke
      - name: Verify installer, management console, printer policy, and LAN target
        shell: pwsh
        run: ./scripts/SmokeTest.ps1 -InstallerPath ./artifacts/installer/PrinterWLAN-Setup-x64.exe
      - name: Verify real non-loopback LAN HTTP browser flows
        shell: pwsh
        working-directory: tests/PrinterWLAN.UiTests
        run: |
          npm ci
          npx playwright install chromium
          npm test
      - name: Verify uninstall preservation and deletion modes
        shell: pwsh
        run: ./scripts/UninstallTest.ps1 -InstallerPath ./artifacts/installer/PrinterWLAN-Setup-x64.exe
      - name: Generate installer checksum
        shell: pwsh
        run: |
          $file='artifacts/installer/PrinterWLAN-Setup-x64.exe'
          $hash=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PrinterWLAN-Setup-x64.exe" | Set-Content "$file.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v5
        with:
          name: PrinterWLAN-v1.2.0-server-2025-release-candidate
          path: |
            artifacts/installer/PrinterWLAN-Setup-x64.exe
            artifacts/installer/PrinterWLAN-Setup-x64.exe.sha256
            **/TestResults/*.trx
            tests/PrinterWLAN.UiTests/playwright-report/
            artifacts/system-smoke/
          if-no-files-found: error

  publish-release:
    name: Publish non-draft, non-prerelease GitHub Release
    needs: server-2025-release-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: PrinterWLAN-v1.2.0-server-2025-release-candidate
          path: artifacts/release
      - name: Create immutable-tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer=$(find artifacts/release -name PrinterWLAN-Setup-x64.exe -type f -print -quit)
          checksum=$(find artifacts/release -name PrinterWLAN-Setup-x64.exe.sha256 -type f -print -quit)
          gh release create '${{ github.ref_name }}' \
            "$installer" \
            "$checksum" \
            'output/pdf/PrinterWLAN-v1.2.0-User-Guide-zh-CN.pdf' \
            --verify-tag --latest --title 'PrinterWLAN v1.2.0' \
            --notes-file docs/RELEASE_NOTES_v1.2.0.md
