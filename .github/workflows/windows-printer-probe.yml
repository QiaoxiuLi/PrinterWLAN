name: Windows 11 printer inventory probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: windows-11-arm
    steps:
      - name: List installed printers, drivers, and ports
        shell: pwsh
        run: |
          Write-Host '=== Printers ==='
          Get-Printer | Sort-Object Name | Format-List Name,DriverName,PortName,Type,PrinterStatus
          Write-Host '=== Drivers ==='
          Get-PrinterDriver | Sort-Object Name | Format-List Name,Manufacturer,MajorVersion,InfPath
          Write-Host '=== Ports ==='
          Get-PrinterPort | Sort-Object Name | Format-List Name,Description,PortMonitor
      - name: Probe installed drivers with PrintDocument and local file ports
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $index = 0
          foreach ($driver in Get-PrinterDriver | Sort-Object Name) {
            $index++
            $printerName = "PrinterWLAN Probe $index"
            $outputPath = "C:\printerwlan-probe-$index.prn"
            try {
              Remove-Item $outputPath -Force -ErrorAction SilentlyContinue
              Add-PrinterPort -Name $outputPath -ErrorAction Stop
              Add-Printer -Name $printerName -DriverName $driver.Name -PortName $outputPath -ErrorAction Stop
              $document = New-Object System.Drawing.Printing.PrintDocument
              $document.PrinterSettings.PrinterName = $printerName
              $document.add_PrintPage({
                param($sender, $eventArgs)
                $eventArgs.Graphics.DrawString('PrinterWLAN Windows 11 driver probe', [System.Drawing.SystemFonts]::DefaultFont, [System.Drawing.Brushes]::Black, 20, 20)
              })
              $document.Print()
              $document.Dispose()
              for ($wait = 0; $wait -lt 30; $wait++) {
                if ((Test-Path $outputPath) -and (Get-Item $outputPath).Length -gt 0) { break }
                Start-Sleep -Seconds 1
              }
              $length = if (Test-Path $outputPath) { (Get-Item $outputPath).Length } else { 0 }
              Write-Host "DRIVER RESULT: $($driver.Name) => $length bytes"
            }
            catch {
              Write-Host "DRIVER RESULT: $($driver.Name) => ERROR: $($_.Exception.Message)"
            }
            finally {
              Get-Printer -Name $printerName -ErrorAction SilentlyContinue | Remove-Printer -ErrorAction SilentlyContinue
              Get-PrinterPort -Name $outputPath -ErrorAction SilentlyContinue | Remove-PrinterPort -ErrorAction SilentlyContinue
            }
          }
