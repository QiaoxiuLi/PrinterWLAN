name: Windows Server 2025 CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-installer:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Prepare pinned offline dependencies
        shell: pwsh
        run: ./scripts/Prepare-ThirdParty.ps1
      - name: Restore
        run: dotnet restore PrinterWLAN.slnx --locked-mode
      - name: Build
        run: dotnet build PrinterWLAN.slnx -c Release --no-restore
      - name: Unit and integration tests
        run: dotnet test PrinterWLAN.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Publish self-contained Windows x64
        run: dotnet publish src/PrinterWLAN/PrinterWLAN.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish
      - name: Compile Inno Setup installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PrinterWLAN.iss'
      - name: Generate ephemeral smoke-test credential
        shell: pwsh
        run: |
          $password=[Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          "PRINTERWLAN_ADMIN_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upgrade from v1.1.0 without data loss
        shell: pwsh
        run: ./scripts/UpgradeTest.ps1 -CurrentInstallerPath ./artifacts/installer/PrinterWLAN-Setup-x64.exe
      - name: Installer smoke test
        shell: pwsh
        run: ./scripts/SmokeTest.ps1 -InstallerPath ./artifacts/installer/PrinterWLAN-Setup-x64.exe
      - name: Playwright browser tests
        shell: pwsh
        working-directory: tests/PrinterWLAN.UiTests
        run: |
          npm ci
          npx playwright install chromium
          npm test
      - name: Uninstall smoke test
        shell: pwsh
        run: |
          $uninstaller = "$env:ProgramFiles\PrinterWLAN\unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing.' }
          Start-Process $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait
          if (Get-Service PrinterWLAN -ErrorAction SilentlyContinue) { throw 'Service still exists after uninstall.' }
      - name: Generate checksum
        shell: pwsh
        run: |
          $file='artifacts/installer/PrinterWLAN-Setup-x64.exe'
          $hash=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PrinterWLAN-Setup-x64.exe" | Set-Content "$file.sha256" -Encoding ascii
      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          $source='C:\ProgramData\PrinterWLAN\Diagnostics'
          if (Test-Path $source) {
            New-Item -ItemType Directory -Force -Path 'artifacts/diagnostics' | Out-Null
            Copy-Item "$source\*" 'artifacts/diagnostics' -Recurse -Force
          }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: PrinterWLAN-v1.2.0-windows-x64
          path: |
            artifacts/installer/PrinterWLAN-Setup-x64.exe
            artifacts/installer/PrinterWLAN-Setup-x64.exe.sha256
            **/TestResults/*.trx
            tests/PrinterWLAN.UiTests/playwright-report/
            artifacts/diagnostics/
          if-no-files-found: warn

  windows-11-desktop-compatibility:
    name: Windows 11 Desktop / real print driver
    needs: build-test-installer
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: PrinterWLAN-v1.2.0-windows-x64
          path: downloaded-artifact
      - name: Full desktop installation and Windows print-driver test
        shell: pwsh
        run: |
          $password=[Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          $installer=(Get-ChildItem downloaded-artifact -Filter PrinterWLAN-Setup-x64.exe -Recurse | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Downloaded installer was not found.' }
          ./scripts/WindowsClientAcceptance.ps1 -InstallerPath $installer -AdminPassword $password -OutputDirectory artifacts/windows-11-smoke
      - name: Uninstall desktop test instance
        if: always()
        shell: pwsh
        run: |
          $uninstaller="$env:ProgramFiles\PrinterWLAN\unins000.exe"
          if (Test-Path $uninstaller) {
            Start-Process $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait
          }
          if (Get-Service PrinterWLAN -ErrorAction SilentlyContinue) { throw 'Service still exists after Windows 11 uninstall.' }
      - name: Collect Windows 11 diagnostics
        if: always()
        shell: pwsh
        run: |
          $source = 'C:\ProgramData\PrinterWLAN\Diagnostics'
          $destination = 'artifacts/windows-11-smoke/Diagnostics'
          if (Test-Path $source) {
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Copy-Item (Join-Path $source '*') $destination -Recurse -Force
          }
      - name: Upload Windows 11 evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: PrinterWLAN-v1.2.0-windows-11-desktop-evidence
          path: artifacts/windows-11-smoke/
          if-no-files-found: warn
